<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  * { margin: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #131615;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px 60px;
    font-family: 'Bricolage Grotesque', sans-serif;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #3ab7cc;
  }

  h1 {
    font-size: 96px;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.025em;
    color: #e9ebe6;
    max-width: 16ch;
  }

  h1 em { font-style: normal; color: #3ab7cc; }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    color: #e9ebe6;
  }

  .place {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    color: #a6afaa;
    margin-top: 6px;
  }

  .rails {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .rail {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    color: #a6afaa;
  }

  .node {
    padding: 8px 14px;
    border: 1.5px solid #414946;
    border-radius: 9px;
    background: #1c201f;
    white-space: nowrap;
  }

  .node-mine {
    color: #8fdbe8;
    border-color: #3ab7cc;
    background: rgba(58, 183, 204, 0.09);
    font-weight: 600;
  }

  .arrow { color: #414946; font-size: 20px; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">backend &middot; distributed systems &middot; go</p>
    <div style="height: 28px"></div>
    <h1>I write software. Backend, systems, <em>and the bits in between.</em></h1>
  </div>
  <div class="bottom">
    <div>
      <div class="name">apurva saraiya</div>
      <div class="place">Bengaluru, India</div>
    </div>
    <div class="rails">
      <span class="rail">
        <span class="node">your code</span>
        <span class="arrow">&rarr;</span>
        <span class="node node-mine">the platform</span>
        <span class="arrow">&rarr;</span>
        <span class="node">production</span>
      </span>
      <span class="rail">
        <span class="node">an ai agent</span>
        <span class="arrow">&rarr;</span>
        <span class="node node-mine">a sandbox</span>
        <span class="arrow">&rarr;</span>
        <span class="node">your codebase</span>
      </span>
    </div>
  </div>
</body>
</html>
