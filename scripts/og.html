<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  * { margin: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #f4f4f0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px 60px;
    font-family: 'Bricolage Grotesque', sans-serif;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0b7285;
  }

  h1 {
    font-size: 96px;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.025em;
    color: #1a1d1c;
    max-width: 16ch;
  }

  h1 em { font-style: normal; color: #0b7285; }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    color: #1a1d1c;
  }

  .rail {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 19px;
    color: #565f5c;
  }

  .node {
    padding: 9px 16px;
    border: 1.5px solid #b9beb2;
    border-radius: 9px;
    background: #fbfbf8;
    white-space: nowrap;
  }

  .node-mine {
    color: #095c6b;
    border-color: #0b7285;
    background: rgba(11, 114, 133, 0.07);
    font-weight: 600;
  }

  .arrow { color: #b9beb2; font-size: 22px; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">platform engineering &middot; distributed systems &middot; go</p>
    <div style="height: 28px"></div>
    <h1>I build platforms that run <em>other people's code.</em></h1>
  </div>
  <div class="bottom">
    <span class="name">apurva saraiya</span>
    <span class="rail">
      <span class="node">an ai agent</span>
      <span class="arrow">&rarr;</span>
      <span class="node node-mine">a sandbox</span>
      <span class="arrow">&rarr;</span>
      <span class="node">your codebase</span>
    </span>
  </div>
</body>
</html>
